# Emulated Wii Remote + Nunchuk driven by the FIFO Pipes/gxpad (tools/gxdev.py pad/press).
# Pipe main stick -> Nunchuk stick, C stick -> IR pointer, Y -> shake (spin).
[Wiimote1]
Device = Pipe/0/gxpad
Source = 1
Buttons/A = `Button A`
Buttons/B = `Button B`
Buttons/- = `Button L`
Buttons/+ = `Button START`
Buttons/Home = `Button R`
D-Pad/Up = `Button D_UP`
D-Pad/Down = `Button D_DOWN`
D-Pad/Left = `Button D_LEFT`
D-Pad/Right = `Button D_RIGHT`
IR/Up = `Axis C Y -`
IR/Down = `Axis C Y +`
IR/Left = `Axis C X -`
IR/Right = `Axis C X +`
IR/Auto Hide = False
IR/Relative Input = False
Shake/X = `Button Y`
Shake/Y = `Button Y`
Shake/Z = `Button Y`
Extension = Nunchuk
Nunchuk/Buttons/C = `Button X`
Nunchuk/Buttons/Z = `Button Z`
Nunchuk/Stick/Up = `Axis MAIN Y -`
Nunchuk/Stick/Down = `Axis MAIN Y +`
Nunchuk/Stick/Left = `Axis MAIN X -`
Nunchuk/Stick/Right = `Axis MAIN X +`
[Wiimote2]
Source = 0
[Wiimote3]
Source = 0
[Wiimote4]
Source = 0
[BalanceBoard]
Source = 0
