# The launcher on Linux and Windows: every push that touches it is tested and packaged on both
# systems (unit tests, then the real app opened and clicked through, from source and packaged,
# with a fake game played end to end). A tag v<version> (npm run release, in launcher/) also
# publishes one GitHub Release with both installers, which installed launchers update from.
name: Launcher

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'launcher/**'
      - 'ROADMAP.md'
      - 'fabric/src/client/java/dev/moui/galaxycraft/client/GalaxyOptions.java'
      - 'fabric/**'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            package: --linux AppImage deb
            exe: dist/linux-unpacked/super-minecraft-galaxy-launcher
            run: xvfb-run -a
          - name: Windows
            os: windows-latest
            package: --win nsis
            exe: dist/win-unpacked/Super Minecraft Galaxy Launcher.exe
            run: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but package.json says $version"; exit 1; }

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Smoke test (from source)
        run: ${{ matrix.run }} npm run smoke

      - name: Package
        run: npm run notes && npx electron-builder ${{ matrix.package }} --publish never

      - name: Smoke test (packaged)
        env:
          SMOKE_EXE: ${{ matrix.exe }}
        run: ${{ matrix.run }} npm run smoke

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.name }}
          path: launcher/smoke-shots/
          if-no-files-found: ignore

      - name: Installers
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.name }}
          path: |
            launcher/dist/*.AppImage
            launcher/dist/*.deb
            launcher/dist/*.exe
            launcher/dist/*.blockmap
            launcher/dist/latest*.yml
          if-no-files-found: error

  mod:
    name: Game mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the mod
        working-directory: fabric
        run: ./gradlew build -x test --no-configuration-cache
      - name: The jar
        run: |
          mkdir -p out
          for f in fabric/build/libs/*.jar; do case "$f" in *-sources.jar|*-dev.jar) ;; *) cp "$f" out/ ;; esac; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: game-mod
          path: out/*.jar
          if-no-files-found: error

  minecraft:
    name: Minecraft (${{ matrix.name }})
    needs: mod
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            run: xvfb-run -a
          - name: Windows
            os: windows-latest
            run: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: game-mod
          path: launcher/mods
      # Windows runners have no GPU driver (OpenGL 1.1 only): Mesa's software OpenGL stands in.
      - name: Software OpenGL (Windows)
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@v2
      - name: Minecraft and Fabric from Mojang's and Fabric's servers, started with the mod
        env:
          MODS_DIR: mods
        run: ${{ matrix.run }} node scripts/mc-integration.js "$RUNNER_TEMP/mc"

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Super Minecraft Galaxy Launcher ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
          body: |
            **Linux:** download the `.AppImage` (it updates itself; `chmod +x` it, then open it) or the `.deb`.
            **Windows:** download the `.exe` installer. Windows SmartScreen may warn because the installer is not signed yet: *More info* > *Run anyway*.

            Launchers already installed download this version by themselves and install it when restarted.
