# The patched Dolphin for players, built and packed so it runs on any recent Linux or Windows
# (Qt and the libraries inside). Built when the Dolphin patch changes, on demand, and for each
# release (launcher.yml calls it). Before the long builds, the host library's tests and the
# heartbeat's clock check run on both systems. On Windows the packed Dolphin is then booted with a
# tiny program and the mod's side of the shared memory is played against it (tools/ci).
name: Dolphin

on:
  push:
    paths:
      - 'dolphin/**'
      - 'protocol/**'
      - 'tools/ci/**'
      - 'fabric/src/main/java/dev/moui/galaxycraft/proto/Layout.java'
      - '.github/workflows/dolphin.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  host:
    name: Host library (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            exe: ''
          - name: Windows
            os: windows-2022
            exe: .exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-12 ninja-build
          echo "CXX=g++-12" >> "$GITHUB_ENV"
      - name: Tests (MSVC with /W4 /WX on Windows, GCC with -Werror on Linux)
        run: |
          [ "$RUNNER_OS" = Windows ] && export CXX=cl
          cmake -S dolphin/galaxycraft -B hostbuild -G Ninja -DCMAKE_BUILD_TYPE=Debug
          ninja -C hostbuild
          hostbuild/galaxycraft_host_tests${{ matrix.exe }}
      - name: The heartbeat's clocks agree (Java's System.nanoTime and C++'s steady_clock)
        run: |
          probe="$PWD/hostbuild/clock_probe${{ matrix.exe }}"
          [ "$RUNNER_OS" = Windows ] && probe=$(cygpath -w "$probe")
          java tools/ci/ClockCheck.java "$probe"

  windows:
    name: Dolphin (Windows)
    needs: host
    # Dolphin at the pin needs Visual Studio 2026 (MSVC 19.51, Source/PCH/pch.h).
    runs-on: windows-2025-vs2026
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      # Dolphin's sources and the patch are LF; Git for Windows would turn them CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Saved even when the build fails, so the next run picks up the compiled files.
      - uses: actions/cache/restore@v4
        with:
          path: |
            dolphin/src
            dolphin/build-win
          key: dolphin-win-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dolphin-win-

      - name: Build and pack
        run: dolphin/package-windows.sh

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            dolphin/src
            dolphin/build-win
          key: dolphin-win-${{ github.run_id }}-${{ github.run_attempt }}

      - name: It boots, shares the memory with the mod and agrees on the time
        run: |
          python tools/ci/make_dol.py "$RUNNER_TEMP/loop.dol"
          USER_DIR="$RUNNER_TEMP/dolphin-user"
          export GALAXYCRAFT=1
          dist/dolphin-win32-x64/Dolphin.exe -b -u "$(cygpath -w "$USER_DIR")" -v Null \
            -C "Dolphin.DSP.Backend=No Audio Output" -C Dolphin.Interface.ConfirmStop=False \
            -e "$(cygpath -w "$RUNNER_TEMP/loop.dol")" \
            > "$RUNNER_TEMP/dolphin-stdout.txt" 2>&1 &
          DOLPHIN=$!
          WINPID=$(cat /proc/$DOLPHIN/winpid 2>/dev/null || true)
          javac -d "$RUNNER_TEMP/shmcheck" fabric/src/main/java/dev/moui/galaxycraft/proto/Layout.java tools/ci/ShmCheck.java
          status=0
          java -cp "$RUNNER_TEMP/shmcheck" ShmCheck $WINPID || status=$?
          taskkill //F //IM Dolphin.exe || true
          echo "--- Dolphin's output"; cat "$RUNNER_TEMP/dolphin-stdout.txt" || true
          echo "--- galaxycraft.log"; cat "$USER_DIR/Logs/galaxycraft.log" || true
          grep -q "bridge running on" "$USER_DIR/Logs/galaxycraft.log"
          grep -q "clocks agree" "$USER_DIR/Logs/galaxycraft.log"
          exit $status

      - name: Logs of the boot check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-windows-boot-logs
          path: |
            ${{ runner.temp }}/dolphin-user/Logs/
            ${{ runner.temp }}/dolphin-stdout.txt
          if-no-files-found: ignore

      # Everything PLAY needs on Windows without a release: the installed launcher, started by
      # PLAY-TEST.cmd with GXL_GAME_MANIFEST, installs this game.json and the files next to it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      - name: A test build to play (this Dolphin, the module, the mod)
        run: |
          V=0.0.1
          OUT=dist/windows-test-build
          mkdir -p "$OUT"
          (cd fabric && ./gradlew build -x test --no-configuration-cache)
          for f in fabric/build/libs/*.jar; do case "$f" in *-sources.jar|*-dev.jar) ;; *) cp "$f" "$OUT/galaxycraft-$V.jar" ;; esac; done
          tar -czf "$OUT/module-$V.tar.gz" -C release/module .
          cp dist/dolphin-win32-x64.tar.gz "$OUT/dolphin-win32-x64-$V.tar.gz"
          node launcher/scripts/game-manifest.js --version "$V" --dir "$OUT" --local
          cp tools/ci/windows-test-build/* "$OUT/"
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-test-build
          path: dist/windows-test-build/
          if-no-files-found: error

      # Download, unzip, run Dolphin.exe: the folder is the zip GitHub makes of this artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-win32-x64
          path: dist/dolphin-win32-x64/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-win32-x64-tar
          path: dist/dolphin-win32-x64.tar.gz
          if-no-files-found: error

  linux:
    name: Dolphin (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-12 ninja-build pkg-config ccache \
            libevdev-dev libudev-dev libsystemd-dev libxi-dev libxrandr-dev libusb-1.0-0-dev libbluetooth-dev \
            libasound2-dev libpulse-dev libgl1-mesa-dev libegl1-mesa-dev libcurl4-openssl-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libfuse2 file xvfb
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            dolphin/src
            ~/.cache/ccache
          key: dolphin-linux-${{ hashFiles('dolphin/patches/**', 'dolphin/galaxycraft/**', 'dolphin/package-linux.sh') }}
          restore-keys: dolphin-linux-

      - name: Build and pack
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 2G
        run: |
          # A cached source tree may hold an older patch: start it again from the pin.
          if [ -d dolphin/src ]; then git -C dolphin/src checkout -q -- . && git -C dolphin/src clean -fdq; fi
          dolphin/package-linux.sh

      - name: It runs from the bundle (without CI's Qt in the environment, as on a player's machine)
        run: |
          unset LD_LIBRARY_PATH QT_PLUGIN_PATH QML2_IMPORT_PATH QT_ROOT_DIR
          mkdir -p /tmp/try && tar -xzf dist/dolphin-linux-x64.tar.gz -C /tmp/try
          ! ldd /tmp/try/usr/bin/dolphin-emu | grep "not found"
          ldd /tmp/try/usr/bin/dolphin-emu | grep -i qt6 | head -3
          /tmp/try/usr/bin/dolphin-tool --help | head -5 || true
          /tmp/try/usr/bin/dolphin-tool extract --help > /dev/null 2>&1 || /tmp/try/usr/bin/dolphin-tool --help > /dev/null
          # X11 (XWayland on Wayland desktops): the GalaxyCraft input hooks XInput2, so only xcb is bundled.
          xvfb-run -a env QT_QPA_PLATFORM=xcb timeout 20 /tmp/try/usr/bin/dolphin-emu --version
          ls /tmp/try/usr/bin/Sys | head

      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-linux-x64
          path: dist/dolphin-linux-x64.tar.gz
          if-no-files-found: error
