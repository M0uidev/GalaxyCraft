# GalaxyCraft (tools/gxplay.sh): an emulated Wii Remote + Nunchuk with no device of its own.
# Dolphin's GalaxyCraft bridge drives it from keyboard and mouse (and holds it still in
# Minecraft's menus), so whatever controllers the player has set up elsewhere never matter.
[Wiimote1]
