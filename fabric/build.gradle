plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	runs {
		configureEach {
			// Game tests keep their planets apart from the player's, in a folder emptied before each
			// run (a planet left by one run would be landed on by the next). The flags below that
			// need saved planets point it elsewhere: the last -D wins.
			if (name.toLowerCase().contains("gametest"))
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/gametest-planets"
			if (project.hasProperty("galaxycraftDemo")) {
				vmArg "-Dgalaxycraft.demo=true"
			}
			if (project.hasProperty("galaxycraftDemoTicks")) { // tools/gxplay.sh: play for that long
				vmArg "-Dgalaxycraft.demoTicks=${project.property("galaxycraftDemoTicks")}"
			}
			if (project.hasProperty("galaxycraftVoxel")) { // tools/gxvoxel.sh: VoxelPlanetTest in the dev Dolphin
				vmArg "-Dgalaxycraft.voxel=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets" // never the player's planets
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
			if (project.hasProperty("galaxycraftHeld")) { // tools/gxvoxel.sh held: HeldItemTest in the dev Dolphin
				vmArg "-Dgalaxycraft.held=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
			if (project.hasProperty("galaxycraftWater")) { // tools/gxvoxel.sh water: WaterProbe in the dev Dolphin
				vmArg "-Dgalaxycraft.water=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
			if (project.hasProperty("galaxycraftEntities")) { // tools/gxvoxel.sh entities: EntityTest in the dev Dolphin
				vmArg "-Dgalaxycraft.entities=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
			if (project.hasProperty("galaxycraftPerf")) { // tools/gxvoxel.sh perf: PerfProbe in the dev Dolphin
				vmArg "-Dgalaxycraft.perf=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
				if (project.hasProperty("perfOnly")) vmArg "-Dgalaxycraft.perfOnly=${project.property("perfOnly")}"
				if (project.hasProperty("perfRadius")) vmArg "-Dgalaxycraft.perfRadius=${project.property("perfRadius")}"
			}
			if (project.hasProperty("galaxycraftBiomes")) { // tools/gxvoxel.sh biomes: BiomeProbe in the dev Dolphin
				vmArg "-Dgalaxycraft.biomes=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
				if (project.hasProperty("biomesOnly")) vmArg "-Dgalaxycraft.biomesOnly=${project.property("biomesOnly")}"
			}
			if (project.hasProperty("galaxycraftLauncher")) { // tools/gxvoxel.sh launch: LauncherProbe, worlds as galaxies
				vmArg "-Dgalaxycraft.launcher=true"
				vmArg "-Dgalaxycraft.planetDir=" // empty: each world keeps its own galaxy, as when playing
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
			if (project.hasProperty("galaxycraftGalaxy")) { // tools/gxvoxel.sh galaxy: GalaxyProbe, a galaxy of many planets
				vmArg "-Dgalaxycraft.galaxyProbe=true"
				vmArg "-Dgalaxycraft.planetDir=" // empty: each world keeps its own galaxy, as when playing
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
			if (project.hasProperty("galaxycraftUniverse")) { // tools/gxvoxel.sh universe: UniverseProbe, the floating origin and endless systems
				vmArg "-Dgalaxycraft.universeProbe=true"
				if (project.hasProperty("galaxycraftUniverseStation")) vmArg "-Dgalaxycraft.universeStation=true"
				vmArg "-Dgalaxycraft.planetDir=" // empty: each world keeps its own galaxy, as when playing
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
			if (project.hasProperty("galaxycraftApproach")) { // tools/gxvoxel.sh approach: ApproachProbe, planets seen from afar
				vmArg "-Dgalaxycraft.approachProbe=true"
				vmArg "-Dgalaxycraft.planetDir=" // empty: each world keeps its own galaxy, as when playing
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
			if (project.hasProperty("galaxycraftWalk")) { // tools/gxvoxel.sh walk: WalkProbe in the dev Dolphin
				vmArg "-Dgalaxycraft.walk=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
			if (project.hasProperty("galaxycraftMovement")) { // tools/gxvoxel.sh movement: MovementProbe in the dev Dolphin
				vmArg "-Dgalaxycraft.movement=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
				if (project.hasProperty("skinName")) vmArg "-Dgalaxycraft.skinName=${project.property("skinName")}"
			}
			if (project.hasProperty("galaxycraftMining")) { // tools/gxvoxel.sh mining: MiningProbe in the dev Dolphin
				vmArg "-Dgalaxycraft.mining=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
			if (project.hasProperty("galaxycraftDrawn")) { // tools/gxvoxel.sh drawn: DrawnBlocksProbe in the dev Dolphin
				vmArg "-Dgalaxycraft.drawn=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
			if (project.hasProperty("galaxycraftElytra")) { // tools/gxvoxel.sh elytra: ElytraProbe in the dev Dolphin
				vmArg "-Dgalaxycraft.elytra=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
			if (project.hasProperty("galaxycraftStationGame")) { // tools/gxvoxel.sh station: StationDolphinProbe in the dev Dolphin
				vmArg "-Dgalaxycraft.stationGame=true"
				if (project.hasProperty("galaxycraftStationPin")) vmArg "-Dgalaxycraft.stationPin=" + project.property("galaxycraftStationPin")
				if (project.hasProperty("galaxycraftStationUp")) vmArg "-Dgalaxycraft.stationUp=" + project.property("galaxycraftStationUp")
				vmArg "-Dgalaxycraft.stationsAnywhere=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
			if (project.hasProperty("galaxycraftSneak")) { // tools/gxvoxel.sh sneak: SneakProbe in the dev Dolphin
				vmArg "-Dgalaxycraft.sneak=true"
				vmArg "-Dgalaxycraft.trace=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
			if (project.hasProperty("galaxycraftMemory")) { // tools/gxvoxel.sh memory: MemoryProbe in the dev Dolphin
				vmArg "-Dgalaxycraft.memory=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
				if (project.hasProperty("memoryRadius")) vmArg "-Dgalaxycraft.memoryRadius=${project.property("memoryRadius")}"
			}
			// GXC_ARGS=-PrenderDistance=128: blocks around Mario in any probe (the player's setting otherwise)
			if (project.hasProperty("renderDistance")) vmArg "-Dgalaxycraft.renderDistance=${project.property("renderDistance")}"
			if (project.hasProperty("galaxycraftLod")) { // tools/gxvoxel.sh lod: LodProbe in the dev Dolphin
				vmArg "-Dgalaxycraft.lod=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
				if (project.hasProperty("lodRadius")) vmArg "-Dgalaxycraft.lodRadius=${project.property("lodRadius")}"
			}
			if (project.hasProperty("galaxycraftTp")) { // tools/gxvoxel.sh tp: TpProbe in the dev Dolphin
				vmArg "-Dgalaxycraft.tp=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
			if (project.hasProperty("galaxycraftFit")) { // tools/gxfit.sh: MarioFitTest in the dev Dolphin
				vmArg "-Dgalaxycraft.fit=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
			if (project.hasProperty("galaxycraftBlocks")) { // BlockRulesProbe: Minecraft's blocks on a planet, no game
				vmArg "-Dgalaxycraft.blocks=true"
				vmArg "-Dgalaxycraft.hidden=true"
			}
			if (project.hasProperty("galaxycraftStation")) { // StationProbe: a station's life, no game
				vmArg "-Dgalaxycraft.station=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.stationsAnywhere=true"
			}
			if (project.hasProperty("galaxycraftSpawn")) { // SpawnProbe: mobs spawning on a planet, no game
				vmArg "-Dgalaxycraft.spawn=true"
				vmArg "-Dgalaxycraft.hidden=true"
			}
			if (project.hasProperty("galaxycraftEditor")) { // PlanetEditorProbe: the /galaxycraft editor, no game
				vmArg "-Dgalaxycraft.editor=true"
				vmArg "-Dgalaxycraft.planetDir=${buildDir}/test-planets"
			}
			if (project.hasProperty("galaxycraftFloorGrow")) { // floors' collision wider, blocks
				vmArg "-Dgalaxycraft.floorGrow=${project.property("galaxycraftFloorGrow")}"
			}
			if (project.hasProperty("galaxycraftCrust")) { // crust depth of new planets, blocks
				vmArg "-Dgalaxycraft.crustDepth=${project.property("galaxycraftCrust")}"
			}
			if (project.hasProperty("galaxycraftWallInset")) { // walls collide inside their block, blocks
				vmArg "-Dgalaxycraft.wallInset=${project.property("galaxycraftWallInset")}"
			}
			if (project.hasProperty("galaxycraftMarioRadius")) { // Mario's collision on planets, blocks
				vmArg "-Dgalaxycraft.marioRadius=${project.property("galaxycraftMarioRadius")}"
			}
			if (project.hasProperty("galaxycraftPlanet")) { // a voxel planet once linked (PlanetClient)
				vmArg "-Dgalaxycraft.planet=true"
			}
			if (name == "client" && project.hasProperty("galaxycraftGameDir")) { // tools/gxplay.sh: kept between runs
				runDir = project.property("galaxycraftGameDir")
			}
			if (project.hasProperty("galaxycraftTraceBodies")) { // tools/gxplay.sh with GXC_TRACE_BODIES=1: bodies near Mario, once a second
				vmArg "-Dgalaxycraft.traceBodies=true"
			}
			if (project.hasProperty("galaxycraftHidden")) { // no window on the desktop
				vmArg "-Dgalaxycraft.hidden=true"
			}
			if (project.hasProperty("galaxycraftGalaxy")) { // tools/gxe2e.sh: SMG2 in the dev Dolphin
				vmArg "-Dgalaxycraft.galaxy=true"
				vmArg "-Dgalaxycraft.hidden=true"
				vmArg "-Dgalaxycraft.repoRoot=${rootDir.parentFile.absolutePath}"
			}
		}
	}

	mods {
		"galaxycraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform {
		// Tests tagged "timing" measure against a wall-clock budget sized for a desktop: CI's
		// runners are slower and fail them on Linux and Windows alike.
		if (System.getenv("CI")) excludeTags "timing"
	}
	// Tests that drive tools/fake_galaxy.py need the repository root.
	systemProperty "galaxycraft.repoRoot", rootDir.parentFile.absolutePath
	// Unit tests are written for 100 galaxy units per block, whatever the mod's default is.
	systemProperty "galaxycraft.unitsPerBlock", "100"
	testLogging { events "failed"; exceptionFormat "full" }
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "galaxycraft-gametest"
		enableGameTests = false
		eula = true
	}
}

tasks.matching { it.name == "runClientGameTest" }.configureEach {
	def planets = layout.buildDirectory.dir("gametest-planets").get().asFile
	doFirst { planets.deleteDir() }
}
